[project]
name = "pyproyecto"
version = "0.1.0"
description = "Read and write SwiftProyecto's PROJECT.md format from Python"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Tom Stovall", email = "119924+stovak@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["project.md", "front-matter", "yaml", "screenplay", "podcast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "ruamel-yaml>=0.18",
]

[project.urls]
Homepage = "https://github.com/intrusive-memory/PyProyecto"
Repository = "https://github.com/intrusive-memory/PyProyecto"
"Reference implementation" = "https://github.com/intrusive-memory/SwiftProyecto"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "ruamel.*"
ignore_missing_imports = true

# Tests are checked, but not held to strict-mode annotation rules: pytest
# functions take fixtures and return None, and asserting on an Optional is the
# point of the assertion.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["union-attr", "index", "no-untyped-def", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/pyproyecto"]
